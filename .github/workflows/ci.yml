name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}${{ matrix.yaml == false && ' (no PyYAML)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        yaml: [true]
        include:
          - os: ubuntu-22.04
            python: "3.8"
            yaml: true
          - os: windows-latest
            python: "3.8"
            yaml: true
          - os: ubuntu-latest
            python: "3.13"
            yaml: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyYAML (optional dependency)
        if: matrix.yaml
        run: python -m pip install pyyaml

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test - the good examples pass
        shell: bash
        run: |
          L=plugins/bengali-l10n/skills/translate-to-bengali/scripts/bn_lint.py
          python $L --source examples/en.json --target examples/bn.good.json --digits bn --strict
          python $L --source examples/html/index.en.html --target examples/html/index.bn.html --digits bn

      - name: Smoke test - the bad example fails
        shell: bash
        run: |
          L=plugins/bengali-l10n/skills/translate-to-bengali/scripts/bn_lint.py
          if python $L --source examples/en.json --target examples/bn.bad.json; then
            echo "bn.bad.json should have failed"; exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pyflakes
        run: |
          python -m pip install pyflakes
          python -m pyflakes plugins/bengali-l10n/skills/translate-to-bengali/scripts/bn_lint.py
      - name: All JSON files are valid
        run: |
          find . -name '*.json' -not -name '*bad*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 python -m json.tool > /dev/null
