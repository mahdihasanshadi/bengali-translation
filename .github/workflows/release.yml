name: Release

# Push a tag such as v1.1.0 to publish a GitHub release with the skill zipped
# for claude.ai / Claude Cowork upload. The tag must match plugin.json.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the plugin and linter versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLUGIN=$(python -c "import json;print(json.load(open('plugins/bengali-l10n/.claude-plugin/plugin.json'))['version'])")
          LINT=$(python plugins/bengali-l10n/skills/translate-to-bengali/scripts/bn_lint.py --version | awk '{print $2}')
          echo "tag=$TAG plugin=$PLUGIN linter=$LINT"
          test "$TAG" = "$PLUGIN" && test "$TAG" = "$LINT"

      - name: Run tests
        run: |
          python -m pip install pyyaml
          python -m unittest discover -s tests

      - name: Build translate-to-bengali.skill
        run: |
          cd plugins/bengali-l10n/skills
          zip -r -X "$GITHUB_WORKSPACE/translate-to-bengali.skill" translate-to-bengali \
            -x '*/__pycache__/*' '*.pyc' '*/evals/results/*'
          cd "$GITHUB_WORKSPACE"
          cp translate-to-bengali.skill translate-to-bengali.zip
          unzip -l translate-to-bengali.skill | tail -3

      - name: Release notes from CHANGELOG.md
        run: |
          python - "$GITHUB_REF_NAME" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[?" + re.escape(version) + r"\]?.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else f"Release {version}")
          PY
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" translate-to-bengali.skill translate-to-bengali.zip \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
